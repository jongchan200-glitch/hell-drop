<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
<defs>
 <linearGradient id="steel" x1=".12" y1=".08" x2=".85" y2=".95"><stop stop-color="#f3ede5"/><stop offset=".19" stop-color="#abb2bc"/><stop offset=".43" stop-color="#5b6579"/><stop offset=".68" stop-color="#303548"/><stop offset="1" stop-color="#161e31"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6dfac"/><stop offset=".28" stop-color="#e5b56b"/><stop offset=".6" stop-color="#a76d36"/><stop offset="1" stop-color="#674127"/></linearGradient>
 <linearGradient id="trim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffefd0"/><stop offset=".65" stop-color="#b88747"/><stop offset="1" stop-color="#5a3a28"/></linearGradient>
 <radialGradient id="gem" cx=".35" cy=".25" r=".85"><stop stop-color="#d4ffff"/><stop offset=".26" stop-color="#6cf6ea"/><stop offset=".62" stop-color="#189baf"/><stop offset="1" stop-color="#104c7c"/></radialGradient>
 <filter id="shade" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="1.8" stdDeviation="1.8" flood-color="#030b19" flood-opacity=".78"/></filter>
<mask id="faceCut"><rect x="0" y="0" width="100" height="100" fill="white"/><path d="M27 54Q36 50 43 53H57Q64 50 73 54L71 69Q61 81 50 83Q39 81 29 69z" fill="black"/></mask></defs>
<g filter="url(#shade)" stroke-linejoin="round">
<g mask="url(#faceCut)">
<!-- Solid enclosed skull: covers the original hairstyle, not a tiny perched hat -->
<path d="M6 55C5 18 22 4 50 4s45 14 44 51l-3 21-11 13-18 6H38L20 89 9 75z" fill="#141c2b" stroke="#181629" stroke-width="3"/>
<path d="M9 55C8 23 23 9 50 9s42 14 41 46l-4 15-14 3-13-18H40L27 73l-14-3z" fill="url(#steel)" stroke="#0b1321" stroke-width="2.2"/>
</g>
<!-- Vertical armored skull panels and temple rivets -->
<path d="M31 12C38 7 46 7 50 8c-11 14-15 26-16 43l-12-4c1-17 4-27 9-35z" fill="#e3e5ec" opacity=".18"/>
<path d="M69 12C62 7 54 7 50 8c11 14 15 26 16 43l12-4c-1-17-4-27-9-35z" fill="#020918" opacity=".32"/>
<path d="M31 12 22 44M69 12l9 32" fill="none" stroke="#f6eddf" stroke-opacity=".45" stroke-width="1.7"/>
<path d="M50 10 50 36" stroke="#e4bc7f" stroke-width="4" opacity=".6"/>
<!-- Face opening: truly transparent. Its upper rim covers the bangs. -->
<path d="M19 48Q25 41 33 43L38 55H62L67 43Q75 41 81 48L79 74l-11 13-9 4H41l-9-4-11-13z" fill="none" stroke="#cda063" stroke-width="2.7"/>
<path d="M25 53Q34 51 41 55H59Q66 51 75 53L73 71Q67 79 60 82l-20 0Q33 79 27 71z" fill="#000" fill-opacity="0" stroke="#171c2d" stroke-width="3"/>
<!-- Lower cheek armor, leaves the face itself untouched -->
<path d="M13 56 28 55l3 18 8 13-14-2-13-10z" fill="url(#steel)" stroke="#171b2b" stroke-width="2"/>
<path d="M87 56 72 55l-3 18-8 13 14-2 13-10z" fill="url(#steel)" stroke="#171b2b" stroke-width="2"/>
<path d="M17 65 26 65l4 13-11-5zM83 65 74 65l-4 13 11-5z" fill="#c6c5d0" opacity=".3"/>
<!-- chin and neck closure around the jaw; no hanging cartoon cap -->
<path d="M24 82 36 87h28l12-5-8 13-18 4-18-4z" fill="url(#steel)" stroke="#1d2030" stroke-width="2"/>
<path d="M34 86 50 91l16-5-8 10H42z" fill="url(#trim)" stroke="#5c422a" stroke-width="1.4"/>
<!-- Ear guards integrated with cheeks -->
<circle cx="16" cy="65" r="10" fill="url(#plate)" stroke="#1b2332" stroke-width="2.8"/>
<circle cx="84" cy="65" r="10" fill="url(#plate)" stroke="#1b2332" stroke-width="2.8"/>
<circle cx="16" cy="65" r="6.2" fill="#3b4059" stroke="#f0d8a7" stroke-width="1.4"/>
<circle cx="84" cy="65" r="6.2" fill="#3b4059" stroke="#f0d8a7" stroke-width="1.4"/>
<path d="m16 60 2 5-2 5-2-5zM84 60l2 5-2 5-2-5z" fill="#f5ddae"/>
<!-- brow plate dips below hairline, always covers original fringe -->
<path d="M10 44 21 32 35 38 50 42 65 38 79 32 90 44 78 53 63 50 50 57 37 50 22 53z" fill="url(#plate)" stroke="#563c2c" stroke-width="2.4"/>
<path d="M12 42 24 35 37 43 50 46 63 43 76 35 88 42" fill="none" stroke="#ffefc4" stroke-width="2.7" stroke-linecap="round"/>
<path d="M40 13 50 7 60 13 66 37 50 47 34 37z" fill="url(#plate)" stroke="#593e30" stroke-width="2"/>
<path d="M46 24 50 17 54 24 57 34 50 41 43 34z" fill="#1c617b" stroke="#092537" stroke-width="1.4"/>
<path d="M50 18 57 30 50 39 43 30z" fill="url(#gem)"/>
<path d="M50 19 46 29 50 26" fill="#f6ffff" opacity=".82"/>
<!-- protective side bolts -->
<circle cx="26" cy="38" r="2.2" fill="#fcdfa6" stroke="#6a4227" stroke-width="1"/>
<circle cx="74" cy="38" r="2.2" fill="#fcdfa6" stroke="#6a4227" stroke-width="1"/>
</g></svg>